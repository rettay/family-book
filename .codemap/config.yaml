name: family-book
profile: governance
language: auto

exclude:
  - node_modules
  - .venv
  - dist
  - build
  - __pycache__
  - .git
  - .codemap
  - data
  - docs
  - foundation
  - task_packets
  - docker
  - tests/ui
  - tests/test_phase3.py
  - security_best_practices_report.md

scope:
  - app
  - tests
  - alembic
  - locales

analysis:
  depth: module
  ai_narratives: false
  model: claude-sonnet-4-6

check:
  hardcoded_secrets:
    enabled: true
    severity: fail
    exclude_patterns:
      - "*.test.*"
      - "*.spec.*"
      - "*/__tests__/*"
      - "*/__mocks__/*"
      - "tests/test_phase3.py"
  injection_risks:
    enabled: true
    severity: warn
    exclude_patterns:
      - "*.test.*"
      - "*.spec.*"
      - "*/__tests__/*"
      - "*/__mocks__/*"
      - "tests/test_phase3.py"
  missing_css_selectors:
    enabled: true
    severity: warn
    template_globs:
      - "app/templates/**/*.html"
    script_globs:
      - "app/static/js/**/*.js"
    style_globs:
      - "app/static/css/**/*.css"
  hardcoded_ui_copy:
    enabled: true
    severity: warn
    locale_paths:
      - "locales/en.json"
    scan_globs:
      - "app/templates/person_edit.html"
      - "app/templates/wiki_*.html"
      - "app/templates/partials/wiki_edit_section.html"
    min_length: 6

gc:
  keep: 10
