<!DOCTYPE html>
<html lang="{{ locale }}" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('auth.magic_link_title') }} — {{ brand_display_name }}</title>
  <link rel="stylesheet" href="/static/css/main.css">
  {% include "partials/theme_head.html" %}
</head>
<body>
  <main class="auth-page">
    <div class="auth-card" style="text-align:center;">
      <h1 class="auth-card__title">{{ t('auth.magic_link_title') }}</h1>
      {% if brand_tagline %}
      <p class="auth-card__subtitle">{{ brand_tagline }}</p>
      {% endif %}

      {% if error %}
      <p style="color: var(--danger); margin: 18px 0;">{{ error }}</p>
      <a href="/login" class="btn btn--primary">{{ t('auth.request_new_link') }}</a>
      {% else %}
      <p class="auth-card__subtitle" style="margin-bottom:16px;">
        {{ t('auth.magic_link_confirm') }}
      </p>
      <button id="claim-magic-link" class="btn btn--primary btn--lg">
        {{ t('auth.magic_link_continue') }}
      </button>
      <p id="claim-error" class="hidden" style="color:var(--danger); margin-top:16px;" role="status" aria-live="polite"></p>
      {% endif %}
    </div>
  </main>

  {% if not error %}
  <script>
    document.getElementById('claim-magic-link')?.addEventListener('click', async () => {
      const btn = document.getElementById('claim-magic-link');
      const errorEl = document.getElementById('claim-error');
      const returnToParam = {{ return_to|tojson }};
      btn.disabled = true;
      btn.textContent = '{{ t("common.loading") }}';
      const params = new URLSearchParams();
      if (returnToParam) params.set('return_to', returnToParam);
      const path = {{ ("/auth/magic-link/" + token + "/claim")|tojson }} + (params.toString() ? '?' + params.toString() : '');
      try {
        const resp = await fetch(path, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          credentials: 'same-origin'
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || '{{ t("auth.login_error") }}');
        const returnTo = data.return_to;
        window.location.href = returnTo && returnTo.startsWith('/') && !returnTo.startsWith('//')
          ? returnTo
          : '/tree';
      } catch (err) {
        errorEl.textContent = err.message || '{{ t("auth.login_error") }}';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = '{{ t("auth.magic_link_continue") }}';
      }
    });
  </script>
  {% endif %}
</body>
</html>
