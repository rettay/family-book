{% extends "base.html" %}
{% block title %}{{ t('map.title') }} — {{ t('app.name') }}{% endblock %}
{% block head %}
<style>
  .page { padding-top: var(--nav-h); }
  .map-page {
    display: grid;
    grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
    gap: 1rem;
    min-height: calc(100vh - var(--nav-h) - 2rem);
  }
  .map-panel,
  .map-board {
    border-radius: 24px;
    overflow: hidden;
    background: #fffdf8;
    box-shadow: 0 18px 40px rgba(45, 80, 22, 0.08);
  }
  .map-panel {
    padding: 1rem;
  }
  .map-panel__title {
    margin: 0 0 0.75rem;
    font-size: 1rem;
    font-weight: 700;
  }
  .map-panel label {
    display: block;
    margin-bottom: 0.75rem;
    font-size: 0.9rem;
  }
  .map-panel input,
  .map-panel select,
  .map-panel button {
    width: 100%;
  }
  .map-board {
    position: relative;
    min-height: 72vh;
    background:
      radial-gradient(circle at top, rgba(217, 234, 201, 0.8), transparent 35%),
      linear-gradient(180deg, #eef7ff 0%, #d8ebf4 100%);
  }
  #map-svg {
    display: block;
    width: 100%;
    height: 72vh;
  }
  .map-legend,
  .map-empty {
    position: absolute;
    left: 1rem;
    bottom: 1rem;
    padding: 0.65rem 0.85rem;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.92);
    color: #40563d;
    font-size: 0.9rem;
  }
  .map-empty[hidden] {
    display: none;
  }
  @media (max-width: 900px) {
    .map-page {
      grid-template-columns: 1fr;
    }
    #map-svg,
    .map-board {
      min-height: 60vh;
      height: 60vh;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="map-page" id="map-root" data-empty-text="{{ t('map.empty') }}">
  <aside class="map-panel">
    <h1 class="map-panel__title">{{ t('map.title') }}</h1>
    <p>{{ t('map.description') }}</p>
    <label>
      {{ t('tree.filter_living') }}
      <select id="map-filter-living">
        <option value="all">{{ t('tree.filter_all') }}</option>
        <option value="living">{{ t('tree.filter_living_only') }}</option>
        <option value="deceased">{{ t('tree.filter_deceased_only') }}</option>
      </select>
    </label>
    <label>
      {{ t('tree.filter_branch') }}
      <input type="text" id="map-filter-branch" placeholder="{{ t('tree.filter_branch_placeholder') }}">
    </label>
    <label>
      {{ t('tree.filter_residence_country') }}
      <input type="text" id="map-filter-residence-country" maxlength="2" placeholder="US">
    </label>
    <label>
      {{ t('tree.filter_birth_country') }}
      <input type="text" id="map-filter-birth-country" maxlength="2" placeholder="MX">
    </label>
    <button class="btn btn--primary" id="apply-map-filters">{{ t('map.apply_filters') }}</button>
  </aside>

  <section class="map-board">
    <svg id="map-svg" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet" aria-label="{{ t('map.title') }}"></svg>
    <div class="map-legend">{{ t('map.legend') }}</div>
    <div class="map-empty" id="map-empty" hidden>{{ t('map.empty') }}</div>
  </section>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/map.js"></script>
{% endblock %}
